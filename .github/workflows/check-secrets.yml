name: check secrets

# Run this by hand to test the release secrets without releasing anything: Actions > check secrets
# > Run workflow. It checks that the Sparkle key is the one the app trusts. It imports the
# Developer ID certificate and signs a scratch file with it. It also asks Apple for the
# notarization history with the API key. Every check runs even when an earlier one fails, so one
# run shows them all.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The release runs on this image, so the checks run on it too.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: check the Sparkle key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: node scripts/check-sparkle-key.js

      - name: import signing certificate
        id: keychain
        if: ${{ !cancelled() }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/import-certificate.sh

      # The timestamp needs Apple's server, as it does for a release.
      - name: sign a scratch file
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp /usr/bin/true "$RUNNER_TEMP/scratch"
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.keychain.outputs.identity }}" \
            --keychain "${{ steps.keychain.outputs.keychain }}" \
            "$RUNNER_TEMP/scratch"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/scratch"
          echo "signed as ${{ steps.keychain.outputs.identity }}"

      # The history stays out of the log because it lists earlier submissions.
      - name: check the notarization credentials
        if: ${{ !cancelled() }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          trap 'rm -f "$RUNNER_TEMP/key.p8"' EXIT
          xcrun notarytool history \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" > /dev/null
          echo "Apple accepted the API key"

      - name: remove the keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "${{ steps.keychain.outputs.keychain }}" || true
